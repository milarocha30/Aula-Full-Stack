<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>
</head>
<body>
    
    <!-- CSS inline-->
    <div id="divi1" style="background-color: rgb(214, 151, 214); width: 200px; height: 100px; font-style: italic; font-size: 20px; font-family: Arial; font-weight: bold;">
        <p>Segunda div</p>
        
    </div>

    <div id="divi2">

    </div>

    <!--CSS Interno-->
    <style>
        
            /*div{
            todas as divs sofrem alterações */
        #divi1{
            border-radius: 0px;
        }

        #divi2{
            width: 100px;
            height: 100px;
            background-color: rgb(49, 145, 85);
            border-radius: 20px;
            cursor:alias;
        }

         #divi2:hover{
            width: 100px;
            height: 100px;
            background-color: rgb(49, 145, 85);
            border-radius: 0px;
            cursor: pointer;
        }
        

    </style>

</body>
</html>
